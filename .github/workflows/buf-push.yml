name: Buf (push)
on:
  push:
    branches:
    - main
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Publish Protobuf module
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: bufbuild/buf-action@v1.7.0
      with:
        # No input: the action reads module names from the buf.yaml in its
        # input directory, and ours is at the repository root. Pointing it at
        # proto/ found no named module, so the push step was skipped silently.
        lint: true
        format: false
        breaking: false
        pr_comment: false
        push: true
        # Preserve main-branch publishing with the existing BSR token.
        # jactionlint ignore=secrets-outside-env
        token: ${{ secrets.BUF_TOKEN }}
