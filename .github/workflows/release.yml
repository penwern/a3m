name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  docker:
    name: Publish container image
    timeout-minutes: 30
    permissions:
      contents: read
      # Publish release images to GHCR.
      packages: write
    runs-on: ubuntu-26.04
    environment: release
    steps:
    - name: "Check out source code"
      uses: "actions/checkout@v7.0.1"
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Capture Docker metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: |
          ghcr.io/penwern/a3m
        tags: |
          type=semver,pattern={{raw}}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1
      with:
        cache-binary: false
    - name: Log in to the container registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
  release:
    name: Create GitHub release
    needs: docker
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 10
    permissions:
      # Create the release for the pushed tag.
      contents: write
    runs-on: ubuntu-26.04
    environment: release
    steps:
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" --title "$TAG" --generate-notes --latest --verify-tag
