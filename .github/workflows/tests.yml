name: Tests
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  tests:
    name: "Test"
    runs-on: "ubuntu-22.04"
    steps:
    - name: "Check out source code"
      uses: "actions/checkout@v4"
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true
        version: latest
    - name: Install media tools for the characterisation e2e test
      # jhove must be the Archivematica externals build (as in the production
      # image): Ubuntu's jhove 1.20 emits the pre-OPF XML namespace, which the
      # FPR validation command does not recognise ("Unable to find status!").
      # The JRE and the other tools come from Ubuntu first so that jhove's
      # dependencies are already satisfied and only jhove itself is pulled
      # from the externals repo. atool/p7zip/rsync/unar serve the AIP jobs
      # (submission docs, compression) so the package can reach COMPLETE.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          atool p7zip-full rsync unar \
          ffmpeg imagemagick libimage-exiftool-perl mediainfo default-jre-headless
        curl -fsSL https://packages.archivematica.org/GPG-KEY-archivematica \
          | sudo gpg --dearmor -o /usr/share/keyrings/archivematica.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/archivematica.gpg] http://packages.archivematica.org/1.15.x/ubuntu-externals jammy main" \
          | sudo tee /etc/apt/sources.list.d/archivematica.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends jhove
    - name: Run tests
      run: ./test.sh
    - name: "Upload coverage report"
      if: github.repository == 'penwern/a3m'
      uses: "codecov/codecov-action@v4"
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        files: ./junit.xml
        token: ${{ secrets.CODECOV_TOKEN }}
  e2e:
    name: "Run E2E tests"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and cache
      uses: docker/build-push-action@v5
      with:
        context: .
        tags: a3m:latest
        push: false
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Run test
      run: |
        docker image ls
        docker run \
          --rm \
          --entrypoint=python \
          --env=A3M_DEBUG=yes \
            a3m:latest \
              -m a3m.cli.client \
                --name=MARBLES \
                https://github.com/artefactual/archivematica-sampledata/raw/master/SampleTransfers/Images/pictures/MARBLES.TGA
